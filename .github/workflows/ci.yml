name: CI

on:
  # Push ke branch manapun (bukan hanya main) supaya CI bisa diuji
  # sebelum merge; PR tetap memicu CI seperti biasa.
  push:
  pull_request:

jobs:
  business-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # pgx v5.12 membutuhkan go >= 1.25 (lihat go.mod).
          go-version: '1.25'
      # go.mod ada di services/business-api, bukan di root repo, jadi
      # perintah Go harus jalan dari direktori modul itu (sebelumnya dari
      # root dan akan gagal "does not contain main module").
      - name: Lint (gofmt + vet)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
        working-directory: services/business-api
      - name: Test
        run: go test ./...
        working-directory: services/business-api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build
        # --legacy-peer-deps: @nuxt/cli -> @bomb.sh/tab meminta peer cac
        # ^6.7.14 dan commander ^13/14/15, sementara tree Nuxt memakai cac
        # 7 dan commander 11. npm ci ketat gagal karenanya meski lock fresh
        # (terbukti lokal); flag ini hanya melonggarkan validasi peer,
        # instalasi tetap bersih dari lock dan build tetap memverifikasi.
        run: |
          npm ci --legacy-peer-deps
          npm run build
        working-directory: apps/web
