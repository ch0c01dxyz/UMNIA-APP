name: CI

on:
  # Push ke branch manapun (bukan hanya main) supaya CI bisa diuji
  # sebelum merge; PR tetap memicu CI seperti biasa.
  push:
  pull_request:
  # Dispatch manual: jalan keluar bila sebuah run macet di startup
  # (run #44) dan "Re-run all jobs" tidak lagi membuat attempt baru.
  workflow_dispatch:

jobs:
  business-api:
    # Pin ubuntu-24.04: postgresql-16 ada di repositori default 24.04,
    # sedangkan ubuntu-latest sudah pindah ke 26 dan paketnya tidak ada
    # di sana (terbukti run #40). Pola native yang sama dengan job
    # owner-flow-e2e; tanpa Docker service agar tidak ada dua klaster.
    runs-on: ubuntu-24.04
    # Gate integrasi: tes memakai PostgreSQL nyata dengan role runtime,
    # bukan sekadar unit test yang bisa lolos lewat t.Skip. Tanpa URL
    # database, job ini sengaja gagal (lihat langkah Test), bukan hijau
    # dengan tes integrasi dilewati seperti sebelumnya.
    env:
      BUSINESS_DATABASE_URL: postgres://umnia_business:ci-runtime-only@localhost:5432/umnia_test?sslmode=disable
      # Fixture regresi CHECK F1-04A: tes constraint butuh koneksi pemilik
      # tabel (bootstrap); role runtime ditolak sebelum CHECK (permission
      # denied), jadi tanpa URL ini tes itu dilewati (bukan PASS).
      # Password fixture CI yang dibuang tiap run, sama seperti langkah
      # Prepare di bawah.
      BUSINESS_BOOTSTRAP_DATABASE_URL: postgres://postgres:ci-bootstrap-only@localhost:5432/umnia_test?sslmode=disable
      # Fixture grant operator (F1-OPERATOR-ENTITLEMENT-IMPLEMENT):
      # login per-operator untuk tes CLI/rutin; password HANYA fixture
      # CI yang dibuang tiap run. Peran dibuat langkah Prepare.
      OPERATOR_TEST_DATABASE_URL: postgres://umnia_op_test:ci-operator-only@localhost:5432/umnia_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod membutuhkan go >= 1.26: x/crypto v0.58.0, x/sync v0.24.0
          # dan x/text v0.43.0 mensyaratkan 1.26 (pgx v5.12 sendiri hanya 1.25).
          # Pilih 1.26 secara eksplisit agar builder dan CI memakai toolchain
          # yang sama dengan kebutuhan modul, bukan mengandalkan unduhan
          # otomatis GOTOOLCHAIN dari 1.25.
          go-version: '1.26'
      # go.mod ada di services/business-api, bukan di root repo, jadi
      # perintah Go harus jalan dari direktori modul itu (sebelumnya dari
      # root dan akan gagal "does not contain main module").
      - name: Lint (gofmt + vet)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
        working-directory: services/business-api
      # Validasi manifest modul terhadap skema kanonis (F1-04A): memakai
      # helper validate() dari scripts/validate_blueprint.py saja, tanpa
      # menjalankan main() (yang juga memeriksa tugas + dokumen wajib).
      # jsonschema diinstal eksplisit ke venv terisolasi (bukan asumsi
      # preinstalled); versinya dicetak ke log. Cek negatif memakai
      # validator kanonis yang sama, bukan parser duplikat.
      - name: Validate module manifests (canonical schema)
        run: |
          python3 -m venv /tmp/umnia-validate-venv
          /tmp/umnia-validate-venv/bin/pip install --quiet jsonschema
          /tmp/umnia-validate-venv/bin/python -c "import importlib.metadata; print('jsonschema', importlib.metadata.version('jsonschema'))"
          /tmp/umnia-validate-venv/bin/python -c "
          import sys
          sys.path.insert(0, 'scripts')
          from validate_blueprint import validate
          n = validate('schemas/module-manifest.schema.json', 'examples/*.module.json', 'id')
          assert n == 4, f'want 4 module manifests, got {n}'
          print(f'VALIDATED: {n} module manifests')
          "
          /tmp/umnia-validate-venv/bin/python - <<'PY'
          import copy, json
          import jsonschema
          from pathlib import Path
          schema = json.loads(Path('schemas/module-manifest.schema.json').read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          v = jsonschema.Draft202012Validator(schema)
          base = json.loads(Path('examples/finance-basic.module.json').read_text())
          cases = {
              'unknown field': lambda d: d.update({'tidak_dikenal': True}),
              'missing nested required field': lambda d: d['display'].pop('name_id'),
              'malformed version': lambda d: d.update({'version': '0.1'}),
          }
          for name, mutate in cases.items():
              d = copy.deepcopy(base)
              mutate(d)
              try:
                  v.validate(d)
              except jsonschema.ValidationError:
                  print(f'PASS negative: {name} ditolak')
              else:
                  raise SystemExit(f'FAIL negative: {name} lolos validasi')
          print('VALIDATED: 3 negative schema checks')
          PY
      # PostgreSQL 16 native via APT (pola job owner-flow-e2e): cluster
      # 16/main dibuat saat instalasi dan dijalankan bila belum berjalan.
      # Tanpa Docker service — satu klaster saja, supaya jalur TCP tes
      # dan jalur peer skrip (sudo -u postgres psql) melihat klaster
      # yang sama. Password bootstrap HANYA fixture CI yang dibuang tiap
      # run: peran postgres bawaan cluster baru TIDAK punya password —
      # tetapkan lewat koneksi lokal istimewa (peer auth OS postgres),
      # BUKAN via TCP, sebelum pemakaian TCP.
      - name: Install + bootstrap native PostgreSQL 16 (APT)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          if ! pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; then
            sudo pg_ctlcluster 16 main start
          fi
          pg_lsclusters
          pg_isready -h localhost -p 5432 -U postgres
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE postgres WITH PASSWORD 'ci-bootstrap-only';"
          # Bukti autentikasi TCP + versi server sebelum langkah Prepare.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -tAc "SELECT version();"
      # Password di bawah HANYA fixture CI yang dibuang tiap run, bukan
      # rahasia produksi. Role runtime meniru deployment: NOSUPERUSER,
      # NOBYPASSRLS, pemilik database tes; migrasi dijalankan akun
      # bootstrap superuser (postgres) seperti service migrate Windows.
      - name: Prepare test database
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 2
          done
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE umnia_business NOSUPERUSER NOBYPASSRLS LOGIN PASSWORD 'ci-runtime-only';" \
            -c "CREATE ROLE umnia_operator NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION;" \
            -c "CREATE ROLE umnia_grant_exec NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION;" \
            -c "CREATE ROLE umnia_op_test NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION LOGIN PASSWORD 'ci-operator-only';" \
            -c "GRANT umnia_operator TO umnia_op_test;" \
            -c "CREATE DATABASE umnia_test OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_business OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_empty;" \
            -c "CREATE DATABASE umnia_partial OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_003only OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_004only OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_005only OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_006only OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_007only OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_008only OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_009only OWNER umnia_business;" \
            -c "CREATE DATABASE umnia_extra OWNER umnia_business;"
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_test \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql \
            -f services/business-api/migrations/005_core_master_data.sql \
            -f services/business-api/migrations/006_rental_contracts.sql \
            -f services/business-api/migrations/007_asset_availability.sql \
            -f services/business-api/migrations/008_price_versions.sql \
            -f services/business-api/migrations/009_rental_agreed_prices.sql \
            -f services/business-api/migrations/010_rental_custody.sql \
            -f services/business-api/migrations/011_operator_entitlement.sql \
            -f services/business-api/migrations/012_rental_damaged_lost_return.sql
          # Fixture DB bisnis (F1-OPERATOR-ENTITLEMENT-CI-FIX): skema
          # penuh 001-012, seperti deployment (configure-postgres.sh
          # selalu menerapkan 001-012 ke umnia_business). Preflight
          # configure-postgres.sh memeriksa kepemilikan/hak terhadap DB
          # bisnis bila ada, dan subtes table-privilege/custom-parent
          # memberi hak pada tabel workspaces di sana — DB kosong
          # membuat seed itu gagal 42P01 sebelum skrip berjalan.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_business \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql \
            -f services/business-api/migrations/005_core_master_data.sql \
            -f services/business-api/migrations/006_rental_contracts.sql \
            -f services/business-api/migrations/007_asset_availability.sql \
            -f services/business-api/migrations/008_price_versions.sql \
            -f services/business-api/migrations/009_rental_agreed_prices.sql \
            -f services/business-api/migrations/010_rental_custody.sql \
            -f services/business-api/migrations/011_operator_entitlement.sql \
            -f services/business-api/migrations/012_rental_damaged_lost_return.sql
          # Fixture negatif readiness: database yang berhenti di 002
          # (tanpa registry 003) harus dilaporkan belum siap.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_partial \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql
          # Fixture negatif readiness (F1-04B-B1): database yang berhenti
          # di 003 (tanpa penyimpanan instalasi 004) belum siap.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_003only \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql
          # Fixture negatif readiness (F2-01-A): database yang berhenti
          # di 004 (tanpa master data core 005) belum siap.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_004only \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql
          # Fixture negatif readiness (F2-01-B): database yang berhenti
          # di 005 (tanpa kontrak rental draft 006) belum siap.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_005only \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql \
            -f services/business-api/migrations/005_core_master_data.sql
          # Fixture negatif readiness (F2-01-C): database yang berhenti
          # di 006 (tanpa aset/hold 007) belum siap.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_006only \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql \
            -f services/business-api/migrations/005_core_master_data.sql \
            -f services/business-api/migrations/006_rental_contracts.sql
          # Fixture negatif readiness (F2-01-D): database yang berhenti
          # di 007 (tanpa versi harga 008) belum siap.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_007only \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql \
            -f services/business-api/migrations/005_core_master_data.sql \
            -f services/business-api/migrations/006_rental_contracts.sql \
            -f services/business-api/migrations/007_asset_availability.sql
          # Fixture negatif readiness (F2-01-E): database yang berhenti
          # di 008 (tanpa fakta harga disepakati 009) belum siap.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_008only \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql \
            -f services/business-api/migrations/005_core_master_data.sql \
            -f services/business-api/migrations/006_rental_contracts.sql \
            -f services/business-api/migrations/007_asset_availability.sql \
            -f services/business-api/migrations/008_price_versions.sql
          # Fixture negatif readiness (F2-01-F): database yang berhenti
          # di 009 (tanpa custody serah terima 010) belum siap.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_009only \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql \
            -f services/business-api/migrations/005_core_master_data.sql \
            -f services/business-api/migrations/006_rental_contracts.sql \
            -f services/business-api/migrations/007_asset_availability.sql \
            -f services/business-api/migrations/008_price_versions.sql \
            -f services/business-api/migrations/009_rental_agreed_prices.sql
          # Fixture positif readiness (F2-01-G): kesebelas marker
          # (001-010 + 012) + satu marker tambahan yang tidak dikenal
          # harus tetap siap.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_extra \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql \
            -f services/business-api/migrations/005_core_master_data.sql \
            -f services/business-api/migrations/006_rental_contracts.sql \
            -f services/business-api/migrations/007_asset_availability.sql \
            -f services/business-api/migrations/008_price_versions.sql \
            -f services/business-api/migrations/009_rental_agreed_prices.sql \
            -f services/business-api/migrations/010_rental_custody.sql \
            -f services/business-api/migrations/012_rental_damaged_lost_return.sql \
            -c "INSERT INTO schema_migrations (version) VALUES ('999_future') ON CONFLICT (version) DO NOTHING;"
      # Bukti klaster tunggal: jalur TCP (yang dipakai tes/snapshot) dan
      # jalur peer lokal (yang dipakai configure-postgres.sh via
      # sudo -u postgres psql) harus melihat data_directory, port, dan
      # versi server yang sama. Bila container lama masih mengikat 5432,
      # TCP akan mengembalikan direktori/versi berbeda dan langkah ini
      # gagal sebelum tes berjalan. Sekaligus membuktikan DB fixture
      # umnia_business dapat dijangkau lewat TCP.
      - name: Verify single native cluster (TCP vs peer)
        run: |
          peer="$(sudo -u postgres psql -v ON_ERROR_STOP=1 -tA -d postgres -c "SELECT current_setting('data_directory') || '|' || current_setting('port') || '|' || version();")"
          tcp="$(PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -v ON_ERROR_STOP=1 -tA -d postgres -c "SELECT current_setting('data_directory') || '|' || current_setting('port') || '|' || version();")"
          test -n "$peer" && test "$peer" = "$tcp" || { echo "peer/TCP melihat klaster berbeda"; echo "peer: $peer"; echo "tcp: $tcp"; exit 1; }
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -v ON_ERROR_STOP=1 -tAc "SELECT 1;" -d umnia_business
      # CLI operator (F1-OPERATOR-ENTITLEMENT-IMPLEMENT): dibangun di
      # sini supaya kegagalan build gagal cepat; tes integrasi tetap
      # membangun salinannya sendiri dari sumber yang sama.
      - name: Build operator CLI
        run: go build -o /tmp/grant-entitlement ./cmd/grant-entitlement
        working-directory: services/business-api
      - name: Test (integration gate)
        run: |
          test -n "$BUSINESS_DATABASE_URL" || { echo "BUSINESS_DATABASE_URL wajib di gate integrasi"; exit 1; }
          go test -v ./... 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
          # Anti-skip: bila satu pun tes ter-SKIP, gate gagal. Mode
          # unit-only lokal (tanpa URL) tetap boleh, tapi bukan gate ini.
          if grep -q "SKIP" test.log; then echo "tes integrasi ter-SKIP di gate, gagal"; exit 1; fi
        working-directory: services/business-api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build
        # --legacy-peer-deps: @nuxt/cli -> @bomb.sh/tab meminta peer cac
        # ^6.7.14 dan commander ^13/14/15, sementara tree Nuxt memakai cac
        # 7 dan commander 11. npm ci ketat gagal karenanya meski lock fresh
        # (terbukti lokal); flag ini hanya melonggarkan validasi peer,
        # instalasi tetap bersih dari lock dan build tetap memverifikasi.
        run: |
          npm ci --legacy-peer-deps
          npm run build
        working-directory: apps/web

  owner-flow-e2e:
    runs-on: ubuntu-24.04
    # Alur pemilik di browser NYATA (Playwright + Chromium) melawan web
    # hasil build + business-api yang benar-benar berjalan + PG nyata.
    # Bukan stub request: langkah pengguna memakai UI + proxy same-origin.
    # Tanpa trace/video/HAR/screenshot otomatis supaya rahasia (token,
    # kata sandi, kode undangan) tidak masuk artefak tersimpan.
    # PostgreSQL job ini NATIVE via APT (bukan Docker service): tiket beku
    # mensyaratkan Linux native PG. Job business-api/web tidak diubah.
    env:
      BUSINESS_DATABASE_URL: postgres://umnia_business:ci-runtime-only@localhost:5432/umnia_e2e?sslmode=disable
      BUSINESS_BOOTSTRAP_DATABASE_URL: postgres://postgres:ci-bootstrap-only@localhost:5432/umnia_e2e?sslmode=disable
      E2E_BOOTSTRAP_URL: postgres://postgres:ci-bootstrap-only@localhost:5432/umnia_e2e?sslmode=disable
      # Fixture grant operator E2E (F1-OPERATOR-ENTITLEMENT-IMPLEMENT):
      # CLI dibangun langkah Build operator CLI; DSN hanya hidup di
      # proses tes (tidak ditulis ke file/log). Password HANYA fixture
      # CI yang dibuang tiap run.
      E2E_GRANT_CLI: /tmp/grant-entitlement
      E2E_OPERATOR_DATABASE_URL: postgres://umnia_op_e2e:ci-operator-only@localhost:5432/umnia_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # PostgreSQL 16 native: ubuntu-latest menyediakan postgresql-16 di
      # repositori default; cluster 16/main dibuat saat instalasi dan
      # dijalankan bila belum berjalan. Tanpa Docker Linux runtime.
      # Password bootstrap HANYA fixture CI yang dibuang tiap run: peran
      # postgres bawaan cluster baru TIDAK punya password — PGPASSWORD klien
      # bukan pengganti inisialisasi server (yang dulu dilakukan
      # POSTGRES_PASSWORD pada service Docker). Tetapkan lewat koneksi lokal
      # istimewa (peer auth OS postgres), BUKAN via TCP, sebelum pemakaian TCP.
      - name: Install + bootstrap native PostgreSQL 16 (APT)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          if ! pg_isready -h localhost -p 5432 -U postgres > /dev/null 2>&1; then
            sudo pg_ctlcluster 16 main start
          fi
          pg_lsclusters
          pg_isready -h localhost -p 5432 -U postgres
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE postgres WITH PASSWORD 'ci-bootstrap-only';"
          # Bukti autentikasi TCP + versi server sebelum langkah Prepare.
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -tAc "SELECT version();"
      # Password di bawah HANYA fixture CI yang dibuang tiap run, bukan
      # rahasia produksi. DB terisolasi umnia_e2e (bukan umnia_test) supaya
      # fixture E2E tidak bercampur dengan gate integrasi Go.
      - name: Prepare E2E database (001-012)
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 2
          done
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE umnia_business NOSUPERUSER NOBYPASSRLS LOGIN PASSWORD 'ci-runtime-only';" \
            -c "CREATE ROLE umnia_operator NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION;" \
            -c "CREATE ROLE umnia_grant_exec NOLOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION;" \
            -c "CREATE ROLE umnia_op_e2e NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION LOGIN PASSWORD 'ci-operator-only';" \
            -c "GRANT umnia_operator TO umnia_op_e2e;" \
            -c "CREATE DATABASE umnia_e2e OWNER umnia_business;"
          PGPASSWORD=ci-bootstrap-only psql -h localhost -U postgres -d umnia_e2e \
            -v ON_ERROR_STOP=1 -1 \
            -f services/business-api/migrations/001_init.sql \
            -f services/business-api/migrations/002_identity.sql \
            -f services/business-api/migrations/003_modules.sql \
            -f services/business-api/migrations/004_module_installations.sql \
            -f services/business-api/migrations/005_core_master_data.sql \
            -f services/business-api/migrations/006_rental_contracts.sql \
            -f services/business-api/migrations/007_asset_availability.sql \
            -f services/business-api/migrations/008_price_versions.sql \
            -f services/business-api/migrations/009_rental_agreed_prices.sql \
            -f services/business-api/migrations/010_rental_custody.sql \
            -f services/business-api/migrations/011_operator_entitlement.sql \
            -f services/business-api/migrations/012_rental_damaged_lost_return.sql
      - name: Build + start business-api
        run: |
          go build -o /tmp/umnia-business-api .
          BUSINESS_DATABASE_URL="$BUSINESS_DATABASE_URL" HTTP_LISTEN_ADDR=":8080" \
            /tmp/umnia-business-api > /tmp/umnia-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/readyz > /dev/null || { echo "business-api tidak siap"; cat /tmp/umnia-api.log; exit 1; }
        working-directory: services/business-api
      # CLI operator (F1-OPERATOR-ENTITLEMENT-IMPLEMENT): dipakai fixture
      # E2E (owner-flow.spec.ts) lewat E2E_GRANT_CLI di atas.
      - name: Build operator CLI
        run: go build -o /tmp/grant-entitlement ./cmd/grant-entitlement
        working-directory: services/business-api
      - name: Build web
        run: |
          npm ci --legacy-peer-deps
          npm run build
        working-directory: apps/web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright owner-flow + proxy/session
        # webServer di playwright.config.ts menjalankan dua preview
        # (3000 upstream nyata, 3001 upstream mati); reuseExistingServer
        # mati di CI sehingga keduanya dimulai di sini.
        run: npm run test:e2e
        working-directory: apps/web
