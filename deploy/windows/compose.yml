# Dev Windows (Docker Compose) untuk F1-01 + F1-02 + F1-03.
# PostgreSQL bisnis/admin TERPISAH (service, volume, dan kredensial
# berbeda) dan RustFS ditambahkan di F1-02. Port hanya localhost.
# Password di bawah HANYA untuk dev lokal; ganti lewat .env di pemakaian
# nyata dan jangan commit .env.
#
# Akun database (perbaikan F1-FOUNDATION-REMEDIATION):
# - POSTGRES_USER di tiap service adalah akun BOOTSTRAP superuser
#   (umnia_bootstrap / umnia_admin_bootstrap), BUKAN akun API. Image
#   postgres membuat POSTGRES_USER sebagai superuser, dan superuser
#   melewati RLS — API tidak boleh memakai akun itu.
# - Akun runtime API adalah umnia_business / umnia_admin (NOSUPERUSER,
#   NOBYPASSRLS), dibuat skrip initdb di bawah, dan dipakai API.
# - Migrasi dijalankan service `migrate` sebagai akun bootstrap, pada
#   SETIAP `compose up` (bukan hanya initdb), supaya volume lama ikut
#   ter-upgrade tanpa hapus data. Lihat deploy/windows/README.md untuk
#   jalur upgrade volume yang dibuat sebelum perbaikan ini.
#
# UNVERIFIED di host Windows: file ini belum pernah dijalankan di Windows,
# hanya ditulis mengikuti docs/11-deployment-matrix.md. Jalur yang sama
# (initdb + migrasi + role runtime) diverifikasi pada PostgreSQL 16
# native di Linux dalam tugas perbaikan ini, bukan di Docker Windows.
services:
  postgres-business:
    image: postgres:16-bookworm
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: umnia_business
      POSTGRES_USER: umnia_bootstrap
      POSTGRES_PASSWORD: ${UMNIA_BUSINESS_BOOTSTRAP_PASSWORD:-umnia-dev-only}
      UMNIA_BUSINESS_DB_PASSWORD: ${UMNIA_BUSINESS_DB_PASSWORD:-umnia-dev-only}
      UMNIA_ADMIN_DB_PASSWORD: ${UMNIA_ADMIN_DB_PASSWORD:-umnia-dev-only}
    volumes:
      - postgres-business-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umnia_bootstrap -d umnia_business"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-admin:
    image: postgres:16-bookworm
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: umnia_admin
      POSTGRES_USER: umnia_admin_bootstrap
      POSTGRES_PASSWORD: ${UMNIA_ADMIN_BOOTSTRAP_PASSWORD:-umnia-dev-only}
      UMNIA_BUSINESS_DB_PASSWORD: ${UMNIA_BUSINESS_DB_PASSWORD:-umnia-dev-only}
      UMNIA_ADMIN_DB_PASSWORD: ${UMNIA_ADMIN_DB_PASSWORD:-umnia-dev-only}
    volumes:
      - postgres-admin-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umnia_admin_bootstrap -d umnia_admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrasi bisnis sebagai bootstrap; gagal di sini menghentikan startup
  # API (business-api menunggu service ini selesai sukses).
  migrate:
    image: postgres:16-bookworm
    environment:
      PGHOST: postgres-business
      PGPORT: 5432
      PGUSER: umnia_bootstrap
      PGDATABASE: umnia_business
      PGPASSWORD: ${UMNIA_BUSINESS_BOOTSTRAP_PASSWORD:-umnia-dev-only}
    volumes:
      - ../../services/business-api/migrations:/migrations:ro
    # -1 = satu transaksi untuk keseluruhan pemanggilan psql ini (semua
    # file -f), supaya migrasi gagal tidak meninggalkan keadaan setengah
    # terapan yang tercatat sebagai selesai.
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -1 -f /migrations/001_init.sql
             -f /migrations/002_identity.sql"
    depends_on:
      postgres-business:
        condition: service_healthy
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-umnia-dev-only}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-umnia-dev-only}
    volumes:
      - rustfs-data:/data
    command: ["server", "/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  business-api:
    build:
      context: ../../services/business-api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: development
      HTTP_LISTEN_ADDR: ":8080"
      BUSINESS_DATABASE_URL: postgres://umnia_business:${UMNIA_BUSINESS_DB_PASSWORD:-umnia-dev-only}@postgres-business:5432/umnia_business?sslmode=disable
      STORAGE_ENDPOINT: http://rustfs:9000
    depends_on:
      postgres-business:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080
    depends_on:
      business-api:
        condition: service_healthy

volumes:
  postgres-business-data:
  postgres-admin-data:
  rustfs-data:
